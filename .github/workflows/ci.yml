name: CI

on:
  pull_request:
  # Weekly external link check (internal links are checked on every PR).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, links, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Content lint (markdownlint)
        run: npm run lint:md

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Cache rendered Mermaid diagrams
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/kith-mermaid
          key: mermaid-${{ hashFiles('src/content/**/*.md', 'src/plugins/remark-mermaid.mjs') }}
          restore-keys: mermaid-

      - name: Build (astro check, astro build, pagefind)
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # PRs: internal links only (fast, no flaky external sites). Weekly: everything.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --exclude-path dist/pagefind
            ${{ github.event_name == 'schedule' && '--max-concurrency 8 --accept 200,206,429' || '--offline' }}
            'dist/**/*.html'
          fail: true

      - name: Lighthouse
        if: github.event_name != 'schedule'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Keep build for the preview job
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  # Optional: deploy each PR (including GitCMS editorial-workflow PRs) to a
  # Cloudflare Pages preview. Skipped until the secrets below are configured.
  preview:
    name: Preview (Cloudflare Pages)
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Preview not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to enable PR previews."

      - uses: actions/download-artifact@v8
        if: env.HAS_CF == 'true'
        with:
          name: dist
          path: dist

      - name: Deploy preview
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Creates a GitHub deployment, so the PR shows a "View deployment" link.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kith' }} --branch=${{ github.head_ref }}
