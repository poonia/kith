name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future pubDate go live on their date.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Mermaid diagrams are rendered at build time in headless Chromium.
      # Runners are pinned to ubuntu-24.04: Playwright's --with-deps failed on the
      # ubuntu-latest → Ubuntu 26 image (Oct 2026). Revisit when Playwright supports it.
      - run: npx playwright install --with-deps chromium

      - name: Cache rendered Mermaid diagrams
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/kith-mermaid
          key: mermaid-${{ hashFiles('src/content/**/*.md', 'src/plugins/remark-mermaid.mjs') }}
          restore-keys: mermaid-

      - name: Build (astro check, astro build, pagefind)
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
